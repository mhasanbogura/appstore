<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Store — Build by Mahmudul</title>
<meta name="description" content="A modern app store that syncs apps from Google Drive. Browse, download, install, and manage app updates.">
<link rel="icon" type="image/png" href="icons/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>

<header class="topbar">
  <div class="brand" id="btnBrand" title="Home">
    <img src="icons/icon.png" alt="App Store" class="brand-logo">
    <div class="brand-text">
      <strong>App Store</strong>
      <div class="brand-sub">Build by Mahmudul</div>
    </div>
  </div>
  <button id="btnRefresh" class="icon-btn" aria-label="Refresh" title="Refresh">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
  <button id="btnSettings" class="icon-btn" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
  </button>
</header>

<main id="view-home" class="view">
  <div id="pullHint" class="pull-hint" hidden>
    <span class="pull-dot"></span><span id="pullText">Refreshing...</span>
  </div>
  <div class="toolbar">
    <div class="search-row">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="search-icon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input id="searchInput" type="search" placeholder="Search apps by name or package..." autocomplete="off">
    </div>
    <div class="platform-row">
      <button class="chip active" data-platform="Android">Android</button>
      <button class="chip" data-platform="Windows">Windows</button>
    </div>
    <div id="statsLine" class="stats-line">Loading apps...</div>
  </div>
  <div id="appList" class="app-list"></div>
  <div id="emptyState" class="empty-state" hidden>No apps found.</div>
</main>

<main id="view-settings" class="view" hidden>
  <div class="settings-wrap">
    <div class="page-head">
      <div>
        <h2>Settings</h2>
        <div class="page-sub">Manage app preferences and theme.</div>
      </div>
    </div>
    <section class="card">
      <div class="set-row" style="cursor:default">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><mask id="mooncut"><rect width="24" height="24" fill="white"/><circle cx="17" cy="8" r="7" fill="black"/></mask><circle cx="12" cy="12" r="9" mask="url(#mooncut)"/></svg>
        <span>Dark Mode</span>
        <label class="switch"><input type="checkbox" id="darkToggle"><span class="slider"></span></label>
      </div>
    </section>
    <section class="card">
      <button class="set-row" id="rowAbout">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>About App</span><span class="chev">›</span>
      </button>
    </section>
    <section class="card">
      <button class="set-row" id="rowContact">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span>Contact Developer</span><span class="chev">›</span>
      </button>
    </section>
    <section class="card">
      <a class="set-row" href="https://u2l.ai/AppStore">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Get Android App</span><span class="chev">›</span>
      </a>
    </section>
    <div class="version-footer" id="versionFooter"></div>
  </div>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <button id="modalClose" class="icon-btn modal-x" aria-label="Close">✕</button>
    <div class="modal-head">
      <img id="mIcon" class="modal-icon" alt="">
      <div>
        <div id="mName" class="modal-name"></div>
        <div id="mPkg" class="modal-pkg"></div>
        <div id="mVer" class="modal-ver"></div>
      </div>
    </div>
    <div id="mDesc" class="modal-desc">Loading description...</div>
    <div id="mActions" class="modal-actions"></div>
    <a id="mDownload" class="btn-primary" href="#">Download</a>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js?v=4"></script>
</body>
</html>
